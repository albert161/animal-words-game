<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תפוס את המילה! - משחק לימוד אנגלית</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4299e1, #9f7aea);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            text-align: center;
            color: white;
        }

        .game-area {
            width: 600px;
            height: 400px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin: 20px auto;
        }

        .player {
            width: 60px;
            height: 60px;
            background-image: url('ori.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1000;
            border-radius: 50%;
        }

        .word {
            position: absolute;
            padding: 10px 20px;
            background: linear-gradient(45deg, #4299e1, #3182ce);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
            perspective: 1000px;
        }

        .word.target {
            background: linear-gradient(45deg, #48bb78, #38a169);
        }

        .word.caught {
            animation: flip 1s forwards;
        }

        .word.wrong {
            animation: shake 0.5s ease-in-out;
            background: linear-gradient(45deg, #e53e3e, #c53030);
        }

        .animal-icon {
            font-size: 48px;
            background: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .score {
            font-size: 24px;
            margin-bottom: 20px;
        }

        @keyframes flip {
            0% { transform: rotateY(0); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>תיפסי את המילה הנכונה!</h1>
        <div class="score">ניקוד: <span id="score">0</span></div>
        <div class="animal-icon" id="currentAnimal">🐕</div>
        <div id="translation"></div>
        <div class="game-area" id="gameArea">
            <div class="player" id="player"></div>
        </div>
    </div>

    <script>
        // Initialize speech synthesis
        const speechSynthesis = window.speechSynthesis;
        let speechUtterance = new SpeechSynthesisUtterance();
        speechUtterance.lang = 'en-US';
        speechUtterance.rate = 0.8; // Slightly slower for better learning
        speechUtterance.volume = 1;

        const words = [
            { word: 'Dog', translation: 'כלב', emoji: '🐕' },
            { word: 'Cat', translation: 'חתול', emoji: '🐱' },
            { word: 'Bird', translation: 'ציפור', emoji: '🦜' },
            { word: 'Fish', translation: 'דג', emoji: '🐠' },
            { word: 'Horse', translation: 'סוס', emoji: '🐎' },
            { word: 'Rabbit', translation: 'ארנב', emoji: '🐰' },
            { word: 'Lion', translation: 'אריה', emoji: '🦁' },
            { word: 'Elephant', translation: 'פיל', emoji: '🐘' },
            { word: 'Monkey', translation: 'קוף', emoji: '🐒' },
            { word: 'Giraffe', translation: 'ג׳ירפה', emoji: '🦒' }
        ];

        let currentWordIndex = 0;
        let score = 0;
        let wordElements = [];
        
        const gameArea = document.getElementById('gameArea');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const currentAnimal = document.getElementById('currentAnimal');
        const translation = document.getElementById('translation');

        // Function to speak the word
        function speakWord(word) {
            speechUtterance.text = word;
            speechSynthesis.cancel(); // Cancel any ongoing speech
            speechSynthesis.speak(speechUtterance);
        }

        // יצירת המילים הנעות
        function createWords() {
            // ניקוי מילים קודמות
            wordElements.forEach(el => el.remove());
            wordElements = [];

            words.forEach((wordData, index) => {
                const wordEl = document.createElement('div');
                wordEl.className = `word ${index === currentWordIndex ? 'target' : ''}`;
                wordEl.textContent = wordData.translation;
                wordEl.style.left = Math.random() * (gameArea.offsetWidth - 100) + 'px';
                wordEl.style.top = Math.random() * (gameArea.offsetHeight - 40) + 'px';
                
                // Add mouseover event for pronunciation
                wordEl.addEventListener('mouseover', () => {
                    if (wordEl.textContent === wordData.word) { // Only speak if showing English word
                        speakWord(wordData.word);
                    }
                });

                const speed = {
                    x: (Math.random() - 0.5) * 4,
                    y: (Math.random() - 0.5) * 4
                };

                wordElements.push({ element: wordEl, speed, caught: false });
                gameArea.appendChild(wordEl);
            });
        }

        // עדכון מיקום המילים
        function updateWords() {
            wordElements.forEach(({ element, speed, caught }) => {
                if (caught) return;

                let rect = element.getBoundingClientRect();
                let gameRect = gameArea.getBoundingClientRect();

                let x = rect.left - gameRect.left + speed.x;
                let y = rect.top - gameRect.top + speed.y;

                // בדיקת התנגשות בגבולות
                if (x <= 0 || x >= gameRect.width - rect.width) speed.x *= -1;
                if (y <= 0 || y >= gameRect.height - rect.height) speed.y *= -1;

                element.style.left = x + 'px';
                element.style.top = y + 'px';
            });

            requestAnimationFrame(updateWords);
        }

        // בדיקת התנגשות בין שתי נקודות
        function checkCollision(x1, y1, x2, y2, radius) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy) < radius;
        }

        // עדכון המשחק
        function updateGame(e) {
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            player.style.left = x + 'px';
            player.style.top = y + 'px';

            wordElements.forEach((wordObj, index) => {
                if (wordObj.caught) return;

                const wordRect = wordObj.element.getBoundingClientRect();
                const wordX = wordRect.left - rect.left + wordRect.width / 2;
                const wordY = wordRect.top - rect.top + wordRect.height / 2;

                if (checkCollision(x, y, wordX, wordY, 50)) {
                    wordObj.caught = true;

                    if (index === currentWordIndex) {
                        // Correct word caught
                        score += 100;
                        wordObj.element.classList.add('caught');
                        triggerConfetti();
                        
                        // Flip animation with text change and pronunciation
                        setTimeout(() => {
                            wordObj.element.textContent = words[index].word;
                            speakWord(words[index].word); // Speak the English word
                        }, 250);
                        
                        setTimeout(() => {
                            currentWordIndex = (currentWordIndex + 1) % words.length;
                            updateCurrentWord();
                            createWords();
                        }, 1500);
                    } else {
                        // Wrong word caught
                        score -= 50;
                        wordObj.element.classList.add('wrong');
                        setTimeout(() => {
                            wordObj.caught = false;
                            wordObj.element.classList.remove('wrong');
                        }, 500);
                    }
                    scoreElement.textContent = score;
                }
            });
        }

        function updateCurrentWord() {
            currentAnimal.textContent = words[currentWordIndex].emoji;
            translation.textContent = `מצא את המילה: ${words[currentWordIndex].word}`;
        }

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // אתחול המשחק
        updateCurrentWord();
        createWords();
        updateWords();

        // הוספת מאזין לתנועת העכבר
        gameArea.addEventListener('mousemove', updateGame);
    </script>
</body>
</html>
